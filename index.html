<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>救护车信息 - 救护车辆信息共享平台</title><style>*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;background-color:#f5f6f8;color:#333;line-height:1.5}.navbar{background:#fff;height:44px;display:flex;align-items:center;justify-content:center;position:relative;border-bottom:1px solid #eee;font-size:17px;font-weight:500}.navbar .back-btn{position:absolute;left:15px;font-size:20px;cursor:pointer}.container{padding:15px}.page-title{text-align:center;font-size:18px;font-weight:700;margin:20px 0;color:#222}.card{background:#fff;border-radius:8px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:20px}.card-header{font-size:16px;font-weight:700;margin-bottom:15px;color:#333}.plate-number-box{background-color:#f7f8fa;border-radius:6px;text-align:center;padding:15px 0;margin-bottom:20px}.plate-number{color:#1890ff;font-size:24px;font-weight:700;letter-spacing:1px}.info-item{display:flex;align-items:center;padding:12px 0;border-bottom:1px solid #f0f0f0;font-size:14px}.info-item:last-child{border-bottom:none}.label{color:#666;width:100px;flex-shrink:0}.value{color:#333;flex:1;word-break:break-all;font-weight:500}.action-area{margin-top:40px;text-align:center;padding:0 15px}.submit-btn{display:block;width:100%;background-color:#d93a3a;color:#fff;border:none;border-radius:25px;padding:14px 0;font-size:16px;font-weight:500;cursor:pointer;transition:opacity .2s;position:relative}.submit-btn:active{opacity:.8}.btn-content{display:flex;align-items:center;justify-content:center;gap:8px}.footer-note{margin-top:15px;font-size:12px;color:#999;line-height:1.6}.spinner{display:none;width:16px;height:16px;border:2px solid #fff;border-top:2px solid transparent;border-radius:50%;animation:spin 1s linear infinite}@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.submit-btn.loading .btn-text{display:none}.submit-btn.loading .spinner{display:inline-block}.submit-btn.loading{opacity:.7;pointer-events:none}</style></head><body><div class="container"><h1 class="page-title">救护车辆信息</h1><div class="card"><div class="card-header">车辆信息</div><div class="plate-number-box"><div class="plate-number" id="display-plate"></div></div><div class="info-list"><div class="info-item"><span class="label">车辆编号</span> <span class="value" id="display-code"></span></div><div class="info-item"><span class="label">所属医疗机构</span> <span class="value" id="display-org"></span></div></div></div><div class="action-area"><button class="submit-btn" id="reportBtn" onclick='window.location.href="tel:0316-2237486"'><div class="btn-content"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg> <span class="btn-text">线索收集电话(<label id="display-phone"></label>)</span><div class="spinner"></div></div></button><p class="footer-note">如有关于该救护车辆的服务质量、违规行为等问题，请联系举报。</p></div></div><script>const querystring=window.location.search,params=new URLSearchParams(querystring),plateNumber=params.get("plate"),vehicleCode=params.get("code"),organization=params.get("org"),phone=params.get("phone"),vehicleData={plateNumber:plateNumber,vehicleCode:vehicleCode,organization:organization,phone:phone};function initPage(){document.getElementById("display-plate").textContent=vehicleData.plateNumber,document.getElementById("display-code").textContent=vehicleData.vehicleCode,document.getElementById("display-org").textContent=vehicleData.organization,document.getElementById("display-phone").textContent=vehicleData.phone||"0316-2237486"}initPage()</script></body></html>
