<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>救护车信息二维码生成器</title><script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script><style>:root{--primary-color:#d9534f;--bg-color:#f7f8fa;--card-bg:#ffffff;--text-main:#333333;--text-sub:#666666}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background-color:var(--bg-color);display:flex;justify-content:center;align-items:center;min-height:100vh;padding:20px}.container{background:var(--card-bg);width:100%;max-width:800px;border-radius:12px;box-shadow:0 4px 20px rgba(0,0,0,.05);display:flex;flex-direction:row;overflow:hidden}.config-panel{flex:1;padding:30px;border-right:1px solid #eee}.panel-title{font-size:18px;font-weight:700;color:var(--text-main);margin-bottom:20px;display:flex;align-items:center}.panel-title::before{content:'';display:block;width:4px;height:18px;background:var(--primary-color);margin-right:8px;border-radius:2px}.form-group{margin-bottom:15px}.form-label{display:block;font-size:14px;color:var(--text-sub);margin-bottom:5px}.form-input{width:100%;padding:10px;border:1px solid #ddd;border-radius:6px;font-size:14px;outline:0;transition:border-color .3s}.form-input:focus{border-color:var(--primary-color)}.btn-group{display:flex;gap:10px;margin-top:25px}.btn{flex:1;padding:12px;border:none;border-radius:6px;font-size:15px;cursor:pointer;font-weight:500;transition:opacity .2s}.btn-primary{background-color:var(--primary-color);color:#fff}.btn-outline{background-color:transparent;border:1px solid #ddd;color:var(--text-main)}.btn:hover{opacity:.9}.preview-panel{flex:1;padding:30px;background-color:#fafafa;display:flex;flex-direction:column;align-items:center;justify-content:center}.qr-wrapper{background:#fff;padding:20px;border-radius:8px;box-shadow:0 2px 10px rgba(0,0,0,.05);margin-bottom:20px;min-height:200px;display:flex;align-items:center;justify-content:center}#qrcode-canvas{max-width:100%;height:auto}.download-hint{font-size:12px;color:#999;text-align:center}@media (max-width:768px){.container{flex-direction:column-reverse}.config-panel{border-right:none;border-bottom:1px solid #eee}.preview-panel{padding:40px 20px}}</style></head><body><div class="container"><div class="config-panel"><div class="panel-title">信息配置</div><div class="form-group"><label class="form-label">车牌号码</label> <input type="text" id="plateNo" class="form-input" value="冀R711QY"></div><div class="form-group"><label class="form-label">车辆编号</label> <input type="text" id="vehicleId" class="form-input" value="1310002025112400623"></div><div class="form-group"><label class="form-label">所属医疗机构</label> <input type="text" id="hospital" class="form-input" value="大厂回族自治县中医医院"></div><div class="form-group"><label class="form-label">联系电话</label> <input type="text" id="phone" class="form-input" value="0316-2237486"></div><div class="btn-group"><button class="btn btn-outline" onclick="resetForm()">重置</button> <button class="btn btn-primary" onclick="generateQR()">生成二维码</button></div></div><div class="preview-panel"><div class="panel-title" style="margin-bottom:15px">二维码预览</div><div class="qr-wrapper" id="qrcode-container"><canvas id="qrcode-canvas"></canvas></div><button class="btn btn-primary" style="width:100%;max-width:200px" onclick="downloadQR()">下载二维码</button><p class="download-hint" style="margin-top:10px">手机端可长按图片直接保存</p></div></div><script>let currentQRContent="",currentCanvas=null;function generateQR(){const e=document.getElementById("qrcode-canvas"),t=document.getElementById("plateNo").value.trim(),n=document.getElementById("vehicleId").value.trim(),o=document.getElementById("hospital").value.trim(),l=document.getElementById("phone").value.trim();if(!t)return void alert("请输入车牌号");const a=new URLSearchParams({plate:t,code:n,org:o,phone:l}).toString(),d=window.location.search.split("?")[1],c=`${window.location.href.split("gc.html")[0]}index.html?${a}&${d}`;currentQRContent=c,currentCanvas=e;const r=qrcode(0,"M");r.addData(c),r.make();const u=300;e.width=u,e.height=u;const i=e.getContext("2d"),m=u/r.getModuleCount();i.fillStyle="#FFFFFF",i.fillRect(0,0,u,u),i.fillStyle="#000000";for(let e=0;e<r.getModuleCount();e++)for(let t=0;t<r.getModuleCount();t++)r.isDark(e,t)&&i.fillRect(Math.round(t*m),Math.round(e*m),Math.ceil(m),Math.ceil(m))}function downloadQR(){if(currentCanvas)try{const e=document.createElement("a");e.download=`救护车二维码_${document.getElementById("plateNo").value||"default"}.png`,e.href=currentCanvas.toDataURL("image/png"),document.body.appendChild(e),e.click(),document.body.removeChild(e)}catch(e){console.error("下载失败:",e),alert("下载过程中发生错误，请刷新页面重试。")}else alert("请先生成二维码")}function resetForm(){document.getElementById("plateNo").value="冀R711QY",document.getElementById("vehicleId").value="1310002025112400623",document.getElementById("hospital").value="大厂回族自治县中医医院",document.getElementById("phone").value="0316-2237486",generateQR()}window.onload=function(){generateQR()}</script></body></html>
